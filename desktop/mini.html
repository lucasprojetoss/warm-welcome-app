<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#eef6f2;background:transparent}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{padding:8px}
#panel{
  height:100%;
  padding:12px 13px 11px;
  border:1px solid rgba(124,180,155,.55);
  border-radius:16px;
  background:linear-gradient(155deg,rgba(22,34,29,.88),rgba(9,15,12,.80));
  box-shadow:0 14px 38px rgba(0,0,0,.28);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  padding:2px 2px 8px;
  -webkit-app-region:drag;
  cursor:move;
  user-select:none
}
.brand{font-size:13px;font-weight:800}.version{font-size:10px;color:#a8b8b0}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  -webkit-app-region:no-drag;
  cursor:pointer
}
.card{
  border:1px solid rgba(80,112,98,.48);
  border-radius:9px;
  padding:7px 9px;
  background:rgba(12,22,17,.62)
}
.card small{display:block;color:#91a39a;font-size:9px;text-transform:uppercase;letter-spacing:.08em}
.card strong{font-size:16px}
.current{
  margin-top:8px;
  font-size:11px;
  color:#d0ddd7;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  -webkit-app-region:no-drag;
  cursor:pointer
}
.state{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
  margin-top:7px;
  font-size:9px;
  color:#9bcdb5;
  -webkit-app-region:no-drag;
  cursor:pointer
}
.stateLeft{display:flex;align-items:center;gap:6px}
.hint{color:#87978f}
.dot{width:7px;height:7px;border-radius:50%;background:#70d5a6;box-shadow:0 0 9px rgba(112,213,166,.72)}
.done{border-color:rgba(126,218,174,.8)!important}
.done .state{color:#dcf8e9}
.done .dot{background:#aff1cf}
</style>
</head>
<body>
<div id="panel" title="Arraste pelo topo • clique no painel para abrir">
  <div class="top">
    <div class="brand">🎙️ Lucas Gravações</div>
    <div id="version" class="version">v1.2.5</div>
  </div>

  <div id="restoreArea">
    <div class="grid">
      <div class="card"><small>Lote</small><strong id="total">0</strong></div>
      <div class="card"><small>Prévia</small><strong id="preview">0</strong></div>
      <div class="card"><small>Finalizadas</small><strong id="finalized">0</strong></div>
      <div class="card"><small>Progresso</small><strong id="percent">0%</strong></div>
    </div>

    <div id="current" class="current">Aguardando processamento</div>

    <div class="state">
      <span class="stateLeft"><span class="dot"></span><span id="state">PROGRAMA MINIMIZADO</span></span>
      <span class="hint">clique para abrir</span>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);

window.miniDesktop.onStatus(s=>{
  $('total').textContent=s.total||0;
  $('preview').textContent=s.previewReady||0;
  $('finalized').textContent=s.finalized||0;
  $('percent').textContent=(s.percent||0)+'%';
  $('current').textContent=s.current||'Aguardando';
  $('version').textContent='v'+(s.version||'1.2.5');

  if(s.completed){
    $('state').textContent='LOTE FINALIZADO ✓';
  }else if((s.percent||0)>0 || (s.finalized||0)>0 || (s.previewReady||0)>0){
    $('state').textContent='SEGUNDO PLANO ATIVO';
  }else{
    $('state').textContent='PROGRAMA MINIMIZADO';
  }

  $('panel').classList.toggle('done',!!s.completed);
});

$('restoreArea').addEventListener('click',()=>window.miniDesktop.restore());
</script>
</body>
</html>
