name: Build Portable Latest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lucas-gravacoes-portable-latest
  cancel-in-progress: true

jobs:
  build-portable:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar codigo critico
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          node --check "$env:GITHUB_WORKSPACE\desktop\main.cjs"
          if ($LASTEXITCODE -ne 0) { throw "desktop/main.cjs possui erro de sintaxe." }

          node --check "$env:GITHUB_WORKSPACE\desktop\preload.cjs"
          if ($LASTEXITCODE -ne 0) { throw "desktop/preload.cjs possui erro de sintaxe." }

          $package = Get-Content "$env:GITHUB_WORKSPACE\desktop\package.json" -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $index = Get-Content "$env:GITHUB_WORKSPACE\index.html" -Raw
          $main = Get-Content "$env:GITHUB_WORKSPACE\desktop\main.cjs" -Raw
          $updater = "$env:GITHUB_WORKSPACE\desktop\portable-updater.cmd"

          if (!(Test-Path $updater)) { throw "portable-updater.cmd ausente." }
          if ($index -notmatch [regex]::Escape("v$version")) { throw "Versao visual nao confere com package.json." }
          if ($index -notmatch [regex]::Escape("APP_VERSION='$version'")) { throw "APP_VERSION nao confere com package.json." }
          if ($main -notmatch [regex]::Escape("version: '$version'")) { throw "Versao interna nao confere com package.json." }

          Write-Host "Validacao critica OK. Versao:" $version

      - name: Instalar dependencias do desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location "$env:GITHUB_WORKSPACE\desktop"

          npm install --include=dev --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {
            throw "npm install falhou."
          }

          $package = Get-Content ".\package.json" -Raw | ConvertFrom-Json
          $electronVersion = [string]$package.devDependencies.electron
          $electronVersion = $electronVersion.TrimStart('^','~','>','=','<',' ')
          $electronPackage = ".\node_modules\electron"
          $electronExe = Join-Path $electronPackage "dist\electron.exe"

          if (!(Test-Path $electronExe) -and (Test-Path (Join-Path $electronPackage "install.js"))) {
            Write-Host "Executando instalador oficial do pacote Electron..."
            node (Join-Path $electronPackage "install.js")
          }

          if (!(Test-Path $electronExe)) {
            Write-Host "Runtime Electron ainda ausente. Baixando diretamente do release oficial..."
            $electronZip = Join-Path $env:RUNNER_TEMP "electron-win32-x64.zip"
            $electronUrl = "https://github.com/electron/electron/releases/download/v$electronVersion/electron-v$electronVersion-win32-x64.zip"
            if (Test-Path $electronZip) { Remove-Item $electronZip -Force }
            $dist = Join-Path $electronPackage "dist"
            if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
            New-Item -ItemType Directory -Path $dist -Force | Out-Null

            Invoke-WebRequest -Uri $electronUrl -OutFile $electronZip -UseBasicParsing
            Expand-Archive -LiteralPath $electronZip -DestinationPath $dist -Force
            Set-Content -LiteralPath (Join-Path $electronPackage "path.txt") -Value "electron.exe" -NoNewline -Encoding ascii
          }

          if (!(Test-Path $electronExe)) {
            throw "Electron nao foi preparado corretamente."
          }

          if (!(Test-Path ".\node_modules\lamejs\lame.min.js")) {
            throw "lamejs nao foi instalado corretamente."
          }

          Write-Host "Electron pronto:" $electronExe

      - name: Montar pacote portatil
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $buildRoot = Join-Path $env:RUNNER_TEMP 'LucasGravacoesPortableBuild'
          $portableRoot = Join-Path $buildRoot 'LucasGravacoes-Portable'
          $zip = Join-Path $env:RUNNER_TEMP 'LucasGravacoes-Portable.zip'
          $package = Get-Content "$env:GITHUB_WORKSPACE\desktop\package.json" -Raw | ConvertFrom-Json
          $version = [string]$package.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Versao do pacote nao encontrada."
          }

          if (Test-Path $buildRoot) {
            Remove-Item $buildRoot -Recurse -Force
          }
          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          New-Item -ItemType Directory -Path $portableRoot -Force | Out-Null

          & robocopy.exe "$env:GITHUB_WORKSPACE" "$portableRoot" /E /R:2 /W:1 /XD "$env:GITHUB_WORKSPACE\.git" "$env:GITHUB_WORKSPACE\.github" "$env:GITHUB_WORKSPACE\LucasGravacoes-Dados" /XF "desktop-runtime.log"
          $rc = $LASTEXITCODE
          if ($rc -ge 8) {
            throw "Robocopy falhou com codigo $rc."
          }

          if (!(Test-Path (Join-Path $portableRoot 'desktop\node_modules\electron\dist\electron.exe'))) {
            throw "O pacote portatil nao contem Electron."
          }

          if (!(Test-Path (Join-Path $portableRoot 'ABRIR-LUCAS-GRAVACOES-PORTATIL.vbs'))) {
            throw "O abridor portatil nao foi incluido."
          }

          if (!(Test-Path (Join-Path $portableRoot 'desktop\portable-updater.cmd'))) {
            throw "O atualizador CMD nao foi incluido no pacote."
          }

          $builtPackage = Get-Content (Join-Path $portableRoot 'desktop\package.json') -Raw | ConvertFrom-Json
          if ([string]$builtPackage.version -ne $version) {
            throw "A versao dentro do pacote nao confere com a versao do build."
          }

          & 7z.exe a -tzip "$zip" "$portableRoot"
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao compactar pacote portatil."
          }

          "PORTABLE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PORTABLE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publicar pacote portable-latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          gh release view portable-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create portable-latest --title "Lucas Gravacoes Portable - Preparando" --notes "Pacote portatil em preparacao." --latest=false --target "$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) {
              throw "Nao foi possivel criar a release portable-latest."
            }
          }

          gh release upload portable-latest "$env:PORTABLE_ZIP#LucasGravacoes-Portable.zip" --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Nao foi possivel publicar LucasGravacoes-Portable.zip."
          }

          gh api "repos/$env:GITHUB_REPOSITORY/git/refs/tags/portable-latest" -X PATCH -f sha="$env:GITHUB_SHA" -F force=true *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "Nao foi possivel alinhar a tag portable-latest com o build atual."
          }

          $notes = "version=$env:PORTABLE_VERSION`nPacote automatico usado pelo botao Atualizar portatil."
          gh release edit portable-latest --title "Lucas Gravacoes Portable v$env:PORTABLE_VERSION" --notes "$notes" --latest=false
          if ($LASTEXITCODE -ne 0) {
            throw "Pacote enviado, mas nao foi possivel atualizar os metadados da release."
          }
